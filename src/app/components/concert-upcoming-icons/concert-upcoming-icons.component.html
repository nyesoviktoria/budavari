<div class="concerts-upcoming__icons-container">
  <a
    [title]="'BVKZ.CONCERTS_CONTAINER__COMPONENT.CONCERTS_UPCOMING__ICON_CALENDAR_TITLE' | translate"
    target="_blank"
    [href]="concertCalendarUrl"
  >
    <img
      class="concerts-upcoming__icon"
      [src]="'calendar-days' | iconItem"
      [alt]="'BVKZ.CONCERTS_CONTAINER__COMPONENT.CONCERTS_UPCOMING__ICON_CALENDAR_ALT' | translate"
  /></a>

  <a [title]="'BVKZ.CONCERTS_CONTAINER__COMPONENT.CONCERTS_UPCOMING__ICON_MAP_TITLE' | translate" target="_blank" [href]="locationMapUrl">
    <img
      class="concerts-upcoming__icon"
      [src]="'map-location-dot' | iconItem"
      [alt]="'BVKZ.CONCERTS_CONTAINER__COMPONENT.CONCERTS_UPCOMING__ICON_MAP_ALT' | translate"
  /></a>

  @if (concertActual().FacebookEventUrl) {
    <a
      [title]="'BVKZ.CONCERTS_CONTAINER__COMPONENT.CONCERTS_UPCOMING__ICON_FACEBOOK_EVENT_TITLE' | translate"
      target="_blank"
      [href]="concertActual().FacebookEventUrl"
    >
      <img
        class="concerts-upcoming__icon"
        [src]="'square-facebook' | iconItem"
        [alt]="'BVKZ.CONCERTS_CONTAINER__COMPONENT.CONCERTS_UPCOMING__ICON_FACEBOOK_EVENT_ALT' | translate"
    /></a>
  }
  @if (concertActual().InviteImageSource) {
    <span
      [title]="'BVKZ.CONCERTS_CONTAINER__COMPONENT.CONCERTS_UPCOMING__ICON_INVITE_TITLE' | translate"
      class="invite"
      (click)="onOpenInviteDialog(concertActual().InviteImageSource ?? '')"
      ><img
        class="concerts-upcoming__icon"
        [src]="'music-solid' | iconItem"
        [alt]="'BVKZ.CONCERTS_CONTAINER__COMPONENT.CONCERTS_UPCOMING__ICON_INVITE_ALT' | translate"
    /></span>
  }
</div>
